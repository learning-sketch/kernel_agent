# `tox -e py310` is the minimum-version gate (requires-python = ">=3.10" in pyproject.toml).
[tox]
envlist = py310, py311, py312
isolated_build = true

[testenv]
deps =
    pytest>=8.0
    numpy>=1.26
passenv = CC, OMP_NUM_THREADS, KOPT_CACHE_DIR
commands =
    python -m compileall -q kopt_agent ops tests
    python -m pytest -q {posargs}
