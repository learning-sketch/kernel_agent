[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-opt-agent"
version = "0.1.0"
description = "An agent loop that implements operators as kernels on a target chip and searches for the fastest correct version."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kopt = "kopt_agent.cli:main"

[tool.setuptools.packages.find]
include = ["kopt_agent*", "ops*"]
