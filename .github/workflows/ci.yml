name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared minimum (requires-python) and must stay green.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgomp1
          gcc --version
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Byte-compile against this interpreter (catches version-specific syntax early)
        run: python -m compileall -q kopt_agent ops tests
      - name: Run tests
        env:
          KOPT_CACHE_DIR: ${{ runner.temp }}/kopt-cache
        run: python -m pytest -q tests
